<main class="manager-shell">
  <header class="hero">
    <h1>VM Manager</h1>
    <p>Componentized UI modules: manager, vm-window, vm-details</p>
  </header>

  @if (isLoading) {
  <section class="notice">Loading manager data...</section>
  }

  @if (error) {
  <section class="notice error">{{ error }}</section>
  }

  @if (infoMessage) {
  <section class="notice success">{{ infoMessage }}</section>
  }

  <app-manager [overview]="overview" [initialConnectionId]="selectedConnectionId" (refresh)="refresh()"
    (toggleStats)="toggleStats()" (addConnection)="addConnection($event)" (createVm)="createVm($event)"
    (openVm)="openVm($event)" (runVm)="runVm($event)" (pauseVm)="pauseVm($event)" (shutdownVm)="shutdownVm($event)"
    (deleteVm)="deleteVm($event)" />

  <app-create-vm [connections]="overview?.connections ?? []" [wizard]="createVmWizard"
    (openWizard)="openCreateVmWizard()" (closeWizard)="closeCreateVmWizard()" (back)="createVmBack()"
    (next)="createVmNext()" (finish)="createVmFinish()" (changeConnection)="createVmChangeConnection($event)"
    (changeInstallMethod)="createVmChangeInstallMethod($event)" (browseIso)="createVmBrowseIso($event)"
    (browseUrl)="createVmBrowseUrl($event)" (browseImportSource)="createVmBrowseImportSource($event)"
    (browseAppSource)="createVmBrowseAppSource($event)"
    (browseOsContainerSource)="createVmBrowseOsContainerSource($event)"
    (toggleDetectOs)="createVmToggleDetectOs($event)" (toggleStorage)="createVmToggleStorage($event)"
    (changeArch)="createVmChangeArch($event)" (changeType)="createVmChangeType($event)"
    (changeMachine)="createVmChangeMachine($event)" (editVmName)="createVmEditVmName($event)" />

  <app-clone-vm [allVms]="allVms()" [dialog]="cloneVmDialog" (openDialog)="openCloneVmDialog()"
    (closeDialog)="closeCloneVmDialog()" (selectSourceVm)="selectCloneSourceVm($event)"
    (chooseCloneMode)="chooseCloneMode($event)" (browseDestination)="browseCloneDestination($event)"
    (changeDiskOptions)="changeCloneDiskOptions($event)" (editCloneName)="editCloneName($event)"
    (confirmClone)="confirmClone()" />

  <app-vm-window [vmWindow]="vmWindow" (closeWindow)="closeVmWindow()" (switchTab)="switchVmWindowTab($event)"
    (action)="runVmWindowActionFromUi($event)" />

  <app-vm-details [allVms]="allVms()" [vmDetails]="vmDetails" (open)="openVmDetails($event)"
    (refresh)="refreshVmDetails()" (selectHardware)="selectDetailsHardware($event)"
    (editGeneral)="editGeneralSettings($event)" (editCpu)="editCpuSettings($event)"
    (editMemory)="editMemorySettings($event)" (editBoot)="editBootSettings($event)"
    (addHardware)="addHardwareFromDetails($event)" (removeHardware)="removeHardwareFromDetails($event)"
    (editStorage)="editStorage($event)" (editNetwork)="editNetwork($event)" (editGraphics)="editGraphics($event)"
    (editTpm)="editTpm($event)" (editVsock)="editVsock($event)" (launchXml)="launchXmlEditor()"
    (launchStorageBrowser)="launchStorageBrowser()" (launchOsList)="launchOsList()"
    (applyChanges)="applyDetailsChanges()" />
</main>
