<section class="dialog-panel">
  <header>
    <h2>Create Volume</h2>
    <button type="button" (click)="toggleOpen()">{{ view.open ? 'Close' : 'Open' }}</button>
  </header>
  @if (view.open) {
  <div class="form">
    <label>Name<input [(ngModel)]="view.name" /></label>
    <label>Pool<select [(ngModel)]="view.pool">@for(pool of view.pools; track pool){<option [value]="pool">{{ pool }}
        </option>}</select></label>
    <label>Format<select [(ngModel)]="view.format">
        <option value="qcow2">qcow2</option>
        <option value="raw">raw</option>
      </select></label>
    <label>Size GB<input type="number" [(ngModel)]="view.sizeGb" min="1" /></label>
    <label>Path<input [(ngModel)]="view.path" /></label>
    <button type="button" (click)="browsePath()">Browse path</button>
    <div class="actions"><button type="button" (click)="createVolume()">Create Volume</button><button type="button"
        (click)="cancel()">Cancel</button></div>
    @if (view.statusMessage) {<div class="notice success">{{ view.statusMessage }}</div>}
    @if (view.errorMessage) {<div class="notice error">{{ view.errorMessage }}</div>}
  </div>
  }
</section>
