@if (dialog; as activeDialog) {
@if (activeDialog.open) {
<section class="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-vm-title">
  <header>
    <h2 id="delete-vm-title">Delete virtual machine</h2>
    <p>{{ activeDialog.statusMessage }}</p>
  </header>

  <p class="warning">This action removes the selected virtual machine and cannot be undone.</p>

  <label>
    <input type="checkbox" [checked]="activeDialog.removeStorage"
      (change)="toggleRemoveStorage.emit($any($event.target).checked)" />
    Remove associated storage
  </label>

  <div class="delete-actions">
    <button type="button" class="danger" (click)="confirmDelete.emit()">Delete VM</button>
    <button type="button" class="secondary" (click)="cancelDelete.emit()">Cancel</button>
    <button type="button" class="text" (click)="closeDialog.emit()">Close</button>
  </div>
</section>
}
}
