<section class="vm-details panel">
  <header class="vm-details-header">
    <h2>VM Details Module (Task 03)</h2>
    <div class="actions">
      <button type="button" (click)="openDetails()">Open Details</button>
      <button type="button" class="secondary" (click)="refresh.emit()" [disabled]="!vmDetails">Refresh</button>
    </div>
  </header>

  <label>
    VM
    <select name="selectedVmId" [(ngModel)]="selectedVmId">
      @for (vm of allVms; track vm.id) {
        <option [ngValue]="vm.id">{{ vm.name }} ({{ vm.state }})</option>
      }
    </select>
  </label>

  @if (vmDetails) {
    <p class="status">{{ vmDetails.statusMessage }}</p>

    <div class="grid">
      <div class="field">
        <label>
          Hardware
          <input name="selectedHardware" [(ngModel)]="selectedHardware" />
        </label>
        <button type="button" (click)="selectHardware.emit(selectedHardware)">Select Hardware</button>
      </div>

      <div class="field">
        <label>
          General Settings
          <input name="generalSettings" [(ngModel)]="generalSettings" />
        </label>
        <button type="button" (click)="editGeneral.emit(generalSettings)">Edit General</button>
      </div>

      <div class="field">
        <label>
          CPU
          <input type="number" name="cpuCount" [(ngModel)]="cpuCount" min="1" />
        </label>
        <button type="button" (click)="editCpu.emit(cpuCount)">Edit CPU</button>
      </div>

      <div class="field">
        <label>
          Memory (MB)
          <input type="number" name="memoryMb" [(ngModel)]="memoryMb" min="512" />
        </label>
        <button type="button" (click)="editMemory.emit(memoryMb)">Edit Memory</button>
      </div>

      <div class="field">
        <label>
          Boot Order
          <input name="bootOrder" [(ngModel)]="bootOrder" />
        </label>
        <button type="button" (click)="editBoot.emit(bootOrder)">Edit Boot</button>
      </div>

      <div class="field">
        <label>
          Value
          <input name="editValue" [(ngModel)]="editValue" placeholder="device or setting value" />
        </label>
        <div class="row-actions">
          <button type="button" (click)="addHardware.emit(editValue || selectedHardware)">Add HW</button>
          <button type="button" (click)="removeHardware.emit(editValue || selectedHardware)">Remove HW</button>
          <button type="button" (click)="editStorage.emit(editValue)">Storage</button>
          <button type="button" (click)="editNetwork.emit(editValue)">Network</button>
          <button type="button" (click)="editGraphics.emit(editValue)">Graphics</button>
          <button type="button" (click)="editTpm.emit(editValue)">TPM</button>
          <button type="button" (click)="editVsock.emit(editValue)">VSOCK</button>
        </div>
      </div>
    </div>

    <div class="module-actions">
      <button type="button" (click)="launchXml.emit()">Launch XML Editor</button>
      <button type="button" (click)="launchStorageBrowser.emit()">Launch Storage Browser</button>
      <button type="button" (click)="launchOsList.emit()">Launch OS List</button>
      <button type="button" class="secondary" (click)="applyChanges.emit()">Apply Changes</button>
    </div>

    <p class="devices">Devices: {{ vmDetails.hardwareDevices.join(', ') }}</p>
  }
</section>
