<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">VMManager Spring Boot App</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --accent: #0ea5e9;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(140deg, #e0f2fe 0%, var(--bg) 45%, #f1f5f9 100%);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(680px, 100%);
            background: var(--card);
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .pill {
            margin-top: 18px;
            display: inline-block;
            padding: 8px 12px;
            border-radius: 999px;
            background: #ecfeff;
            color: #0369a1;
            border: 1px solid #bae6fd;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 th:text="${title}">VMManager Spring Boot App</h1>
        <p th:text="${message}">Your Spring Boot web application is running.</p>
        <span class="pill">Spring Boot + Maven</span>
    </main>
</body>
</html>
